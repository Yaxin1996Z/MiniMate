# ============================================================
# MiniMate — Docker Compose 部署
# 用法：
#   docker compose build            # 构建镜像
#   docker compose up -d            # 启动服务
#   docker compose exec minimate minimate --rebuild  # 重建知识库
#   docker compose logs -f          # 查看日志
#   docker compose down             # 停止
# ============================================================

services:
  minimate:
    build: .
    container_name: minimate
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # 容器内 embedding 模型路径（由下方 volume 挂载）
      - MINIMATE_EMBED_MODEL=/models/bge-m3
      - MINIMATE_KNOWLEDGE_EMBED_MODEL=/models/bge-m3
    volumes:
      - ./output:/app/output
      # 容器独立数据目录（知识库 rag_db、coderepos、memory.db），与宿主机隔离
      # 首次启动后执行 docker compose exec minimate minimate --rebuild 建索引
      - ./docker_data:/root/.minimate
      # 只读挂载宿主机知识库文档（docs/），供容器重建索引
      - ${USERPROFILE:-/root}/.minimate/knowledge/docs:/root/.minimate/knowledge/docs:ro
      # 本地 embedding 模型目录（默认 Windows 路径；其他机器在 .env 设 MINIMATE_MODEL_DIR）
      - ${MINIMATE_MODEL_DIR:-D:/Documents/Models/Embedding}:/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import minimate; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
